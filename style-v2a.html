<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Style 2A - Espacements Généreux</title>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Montserrat', sans-serif; }
        
        .version-label {
            position: fixed; top: 20px; right: 20px; background: #1a1a1a; color: #d4af37;
            padding: 10px 20px; border-radius: 5px; font-weight: 600; z-index: 1000;
        }
        
        .hero {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #fafafa;
            padding: 4rem 2rem;
        }
        
        .hero-content {
            max-width: 800px;
            text-align: center;
        }
        
        /* Sans photo - focus total sur le texte */
        .subtitle {
            font-size: 0.65rem;
            font-weight: 700;
            letter-spacing: 0.35em;
            text-transform: uppercase;
            color: #8b7355;
            margin-bottom: 3rem;
        }
        
        h1 {
            font-family: 'Cormorant Garamond', serif;
            font-size: clamp(3.5rem, 8vw, 6.5rem);
            font-weight: 300;
            line-height: 1.05;
            color: #1a2634;
            margin-bottom: 1rem;
            letter-spacing: -0.02em;
        }
        
        h1 .name {
            display: block;
            font-weight: 600;
            margin-top: 0.5rem;
        }
        
        h1 .highlight {
            color: #c9a961;
        }
        
        /* Séparateur minimaliste */
        .separator {
            width: 60px;
            height: 2px;
            background: #c9a961;
            margin: 3rem auto;
        }
        
        .tagline {
            font-size: 1.25rem;
            line-height: 2;
            color: #525252;
            margin-bottom: 4rem;
            font-weight: 300;
            letter-spacing: 0.01em;
        }
        
        .cta {
            display: flex;
            gap: 1.25rem;
            justify-content: center;
            flex-wrap: wrap;
        }
        
        .btn {
            padding: 1.2rem 3rem;
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            border: none;
            cursor: pointer;
            transition: all 0.35s ease;
            text-decoration: none;
            display: inline-block;
        }
        
        .btn-primary {
            background: #1a2634;
            color: white;
        }
        
        .btn-primary:hover {
            background: #c9a961;
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(26, 38, 52, 0.2);
        }
        
        .btn-secondary {
            background: transparent;
            color: #1a2634;
            border: 1px solid #d4d4d4;
        }
        
        .btn-secondary:hover {
            border-color: #1a2634;
            transform: translateY(-3px);
        }
        
        @media (max-width: 768px) {
            .hero { padding: 3rem 1.5rem; }
            h1 { font-size: 3rem; }
            .tagline { font-size: 1.1rem; }
        }
    </style>
</head>
<body>
    <div class="version-label">STYLE 2A : Espacements Généreux</div>
    
    <section class="hero">
        <div class="hero-content">
            <p class="subtitle">Avocate au Barreau de Martinique</p>
            <h1>
                Maître
                <span class="name">Amélie <span class="highlight">Amirault</span></span>
            </h1>
            <div class="separator"></div>
            <p class="tagline">Experte en droit du travail, droit social et sécurité sociale.<br>J'accompagne entreprises et salariés avec rigueur et humanité.</p>
            <div class="cta">
                <a href="#contact" class="btn btn-primary">Prendre rendez-vous</a>
                <a href="#expertises" class="btn btn-secondary">Mes expertises</a>
            </div>
        </div>
    </section>
</body>
</html>
