<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Version 1 - Impact Professionnel</title>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <style>
        body { margin: 0; padding: 0; }
        .version-label {
            position: fixed;
            top: 20px;
            right: 20px;
            background: #1a1a1a;
            color: #d4af37;
            padding: 10px 20px;
            border-radius: 5px;
            font-family: 'Montserrat', sans-serif;
            font-weight: 600;
            z-index: 1000;
        }
    </style>
</head>
<body>
    <div class="version-label">VERSION 1 : Impact Professionnel</div>
    
    <header class="hero" id="accueil">
        <div class="hero-content">
            <p class="hero-subtitle">Avocate au Barreau de Martinique</p>
            <h1 class="hero-title">Maître Amélie<br><span>Amirault</span></h1>
            <p class="hero-tagline">Experte en droit du travail et social. J'accompagne entreprises et salariés avec rigueur et humanité à Fort-de-France.</p>
            <div class="hero-cta">
                <a href="#contact" class="btn btn-primary">Prendre rendez-vous</a>
                <a href="#expertises" class="btn btn-secondary">Découvrir mes expertises</a>
            </div>
        </div>
        <div class="hero-scroll">
            <span>Défiler</span>
            <div class="scroll-indicator"></div>
        </div>
    </header>
</body>
</html>
