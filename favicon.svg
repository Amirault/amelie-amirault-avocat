<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#c9a961"/>
      <stop offset="100%" style="stop-color:#8b7355"/>
    </linearGradient>
  </defs>
  <!-- Background circle -->
  <circle cx="16" cy="16" r="15" fill="#1a2634"/>
  <!-- Balance scale - simplified justice symbol -->
  <g fill="url(#gold)" stroke="url(#gold)" stroke-width="0.5">
    <!-- Central pillar -->
    <rect x="15" y="10" width="2" height="14" rx="0.5"/>
    <!-- Top beam -->
    <rect x="6" y="9" width="20" height="2" rx="1"/>
    <!-- Left pan -->
    <path d="M6 11 L4 18 Q4 20 8 20 Q12 20 12 18 L10 11" fill="none" stroke-width="1.5"/>
    <!-- Right pan -->
    <path d="M22 11 L20 18 Q20 20 24 20 Q28 20 28 18 L26 11" fill="none" stroke-width="1.5"/>
    <!-- Base -->
    <rect x="11" y="23" width="10" height="2" rx="1"/>
  </g>
  <!-- Initials AA -->
  <text x="16" y="8" font-family="Georgia, serif" font-size="5" fill="#c9a961" text-anchor="middle" font-weight="600">AA</text>
</svg>
