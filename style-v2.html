<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Style 2 - Minimaliste Épuré</title>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Montserrat', sans-serif; }
        
        .version-label {
            position: fixed; top: 20px; right: 20px; background: #1a1a1a; color: #d4af37;
            padding: 10px 20px; border-radius: 5px; font-weight: 600; z-index: 1000;
        }
        
        /* STYLE 2: Minimaliste Épuré */
        .hero-v2 {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #ffffff;
            position: relative;
            padding: 2rem;
        }
        
        /* Accent décoratif subtil */
        .hero-v2::before {
            content: '';
            position: absolute;
            top: 0; left: 0;
            width: 100%;
            height: 4px;
            background: linear-gradient(90deg, #1a2634 0%, #c9a961 50%, #1a2634 100%);
        }
        
        .hero-v2-content {
            max-width: 900px;
            text-align: center;
        }
        
        /* Photo circulaire en haut */
        .hero-v2 .photo {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            margin: 0 auto 2rem;
            overflow: hidden;
            border: 3px solid #c9a961;
            box-shadow: 0 10px 30px rgba(26, 38, 52, 0.15);
        }
        
        .hero-v2 .photo img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        .hero-v2 .subtitle {
            font-size: 0.7rem;
            font-weight: 600;
            letter-spacing: 0.3em;
            text-transform: uppercase;
            color: #8b7355;
            margin-bottom: 1rem;
        }
        
        .hero-v2 h1 {
            font-family: 'Cormorant Garamond', serif;
            font-size: clamp(3rem, 6vw, 5rem);
            font-weight: 400;
            line-height: 1.1;
            color: #1a2634;
            margin-bottom: 1rem;
        }
        
        .hero-v2 h1 span {
            display: block;
            color: #c9a961;
            font-weight: 600;
        }
        
        /* Ligne décorative */
        .hero-v2 .divider {
            width: 80px;
            height: 1px;
            background: #c9a961;
            margin: 2rem auto;
        }
        
        .hero-v2 .tagline {
            font-size: 1.15rem;
            line-height: 1.9;
            color: #525252;
            margin-bottom: 3rem;
            max-width: 700px;
            margin-left: auto;
            margin-right: auto;
            font-weight: 300;
        }
        
        .hero-v2 .cta {
            display: flex;
            gap: 1rem;
            justify-content: center;
            flex-wrap: wrap;
        }
        
        .btn {
            padding: 1rem 2.5rem;
            font-size: 0.8rem;
            font-weight: 600;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            border: none;
            cursor: pointer;
            transition: all 0.3s;
            text-decoration: none;
            display: inline-block;
        }
        
        .btn-primary {
            background: #1a2634;
            color: white;
        }
        
        .btn-primary:hover {
            background: #c9a961;
            transform: translateY(-2px);
        }
        
        .btn-secondary {
            background: transparent;
            color: #1a2634;
            border: 2px solid #e5e5e5;
        }
        
        .btn-secondary:hover {
            border-color: #1a2634;
        }
        
        @media (max-width: 768px) {
            .hero-v2 {
                padding: 3rem 1.5rem;
            }
        }
    </style>
</head>
<body>
    <div class="version-label">STYLE 2 : Minimaliste Épuré</div>
    
    <section class="hero-v2">
        <div class="hero-v2-content">
            <div class="photo">
                <img src="images/amelie-amirault.jpg" alt="Maître Amélie Amirault">
            </div>
            <p class="subtitle">Avocate au Barreau de Martinique</p>
            <h1>Maître <span>Amélie Amirault</span></h1>
            <div class="divider"></div>
            <p class="tagline">Experte en droit du travail, droit social et sécurité sociale. J'accompagne entreprises et salariés avec rigueur et humanité en Martinique.</p>
            <div class="cta">
                <a href="#contact" class="btn btn-primary">Prendre rendez-vous</a>
                <a href="#expertises" class="btn btn-secondary">Découvrir mes expertises</a>
            </div>
        </div>
    </section>
</body>
</html>
