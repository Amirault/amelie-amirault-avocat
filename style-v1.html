<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Style 1 - Split Screen Moderne</title>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Montserrat', sans-serif; }
        
        .version-label {
            position: fixed; top: 20px; right: 20px; background: #1a1a1a; color: #d4af37;
            padding: 10px 20px; border-radius: 5px; font-weight: 600; z-index: 1000;
        }
        
        /* STYLE 1: Split Screen avec Image */
        .hero-v1 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            min-height: 100vh;
            align-items: center;
        }
        
        .hero-v1-content {
            padding: 0 8%;
            background: white;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        
        .hero-v1-image {
            background: linear-gradient(rgba(26, 38, 52, 0.85), rgba(26, 38, 52, 0.85)),
                        url('images/amelie-amirault.jpg') center/cover;
            height: 100vh;
            position: relative;
        }
        
        .hero-v1-image::after {
            content: '';
            position: absolute;
            bottom: 0; left: 0; right: 0;
            height: 200px;
            background: linear-gradient(transparent, rgba(26, 38, 52, 0.95));
        }
        
        .hero-v1 .subtitle {
            font-size: 0.75rem;
            font-weight: 600;
            letter-spacing: 0.25em;
            text-transform: uppercase;
            color: #c9a961;
            margin-bottom: 1.5rem;
        }
        
        .hero-v1 h1 {
            font-family: 'Cormorant Garamond', serif;
            font-size: clamp(2.5rem, 5vw, 4.5rem);
            font-weight: 600;
            line-height: 1.1;
            color: #1a2634;
            margin-bottom: 1.5rem;
        }
        
        .hero-v1 h1 span {
            color: #c9a961;
            font-style: italic;
        }
        
        .hero-v1 .tagline {
            font-size: 1.1rem;
            line-height: 1.8;
            color: #525252;
            margin-bottom: 2.5rem;
            max-width: 500px;
        }
        
        .hero-v1 .cta {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
        }
        
        .btn {
            padding: 1rem 2rem;
            font-size: 0.875rem;
            font-weight: 500;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            border: none;
            cursor: pointer;
            transition: all 0.3s;
            text-decoration: none;
            display: inline-block;
        }
        
        .btn-primary {
            background: #c9a961;
            color: white;
        }
        
        .btn-primary:hover {
            background: #8b7355;
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
        }
        
        .btn-secondary {
            background: transparent;
            color: #1a2634;
            border: 1px solid #1a2634;
        }
        
        .btn-secondary:hover {
            background: #1a2634;
            color: white;
        }
        
        @media (max-width: 968px) {
            .hero-v1 {
                grid-template-columns: 1fr;
            }
            .hero-v1-image {
                height: 40vh;
                order: -1;
            }
            .hero-v1-content {
                height: auto;
                padding: 3rem 2rem;
            }
        }
    </style>
</head>
<body>
    <div class="version-label">STYLE 1 : Split Screen Moderne</div>
    
    <section class="hero-v1">
        <div class="hero-v1-content">
            <p class="subtitle">Avocate au Barreau de Martinique</p>
            <h1>Maître Amélie<br><span>Amirault</span></h1>
            <p class="tagline">Experte en droit du travail, droit social et sécurité sociale. J'accompagne entreprises et salariés avec rigueur et humanité en Martinique.</p>
            <div class="cta">
                <a href="#contact" class="btn btn-primary">Prendre rendez-vous</a>
                <a href="#expertises" class="btn btn-secondary">Mes expertises</a>
            </div>
        </div>
        <div class="hero-v1-image"></div>
    </section>
</body>
</html>
