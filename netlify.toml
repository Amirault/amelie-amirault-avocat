[build]
  publish = "."

# Consolidate all legacy and www hostnames on the official naked domain.
[[redirects]]
  from = "https://amelie-amirault-avocat.fr/*"
  to = "https://amiraultavocats.fr/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.amelie-amirault-avocat.fr/*"
  to = "https://amiraultavocats.fr/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://amirault-avocat.fr/*"
  to = "https://amiraultavocats.fr/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.amirault-avocat.fr/*"
  to = "https://amiraultavocats.fr/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.amiraultavocats.fr/*"
  to = "https://amiraultavocats.fr/:splat"
  status = 301
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Cache static assets — CSS/JS 1h, images 30d
[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
